<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thala7SneakerStore-Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h2>Thala <span>7.</span></h2>
            </div>

            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="payment.html">Payment</a></li>
            </ul>

            <div class="icons">
                <span>🔍</span>
                <span>🛒</span>
                <img src="images/profile.jpg" alt="">
            </div>
        </nav>
    </header>

    <section class="cart-container">

        <div class="cart-left">

            <h1>Shopping Cart</h1>

            <table>

                <tr>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Price</th>
                </tr>

                <tr>
                    <td>Running Shoe</td>
                    <td>1</td>
                    <td>₹1334</td>
                </tr>

            </table>

        </div>

        <div class="cart-right">

            <input type="text"
            placeholder="Coupon Code">

            <button>Apply Coupon</button>

            <div class="summary">

                <p>Subtotal : <span>₹1334</span></p>
                <p>Tax : <span>₹100</span></p>
                <p>Total : <span>₹1434</span></p>

            </div>

            <a href="payment.html">
                <button class="pay-btn">Pay Now</button>
            </a>

        </div>

    </section>

    <a href="product.html" class="continue">
        ← Continue Shopping
    </a>
</body>
</html>
